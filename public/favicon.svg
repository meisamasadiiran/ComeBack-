<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background subtle warm circle -->
  <rect width="64" height="64" rx="16" fill="#F7F5F0"/>
  <!-- The Fall & Return Path in Charcoal -->
  <!-- Arc starts at top right, loops counter-clockwise around left, dips at bottom -->
  <path d="M 46 20 C 34 10 16 16 14 32 C 12 46 22 54 30 54 C 36 54 38 48 38 44 C 38 36 44 32 50 32 H 52" 
        stroke="#171717" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- The Forward Return Accent in Comeback Orange -->
  <path d="M 38 42 C 40 33 46 32 54 32" 
        stroke="#E45A2A" 
        stroke-width="5.5" 
        stroke-linecap="round"/>
  <!-- Forward Dot / Stepping Point -->
  <circle cx="53" cy="32" r="3.5" fill="#E45A2A"/>
</svg>
